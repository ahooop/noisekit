name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # 所有任务统一 UTF-8：Windows runner 默认 cp1252，中文日志会直接抛异常
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖（不含音频后端，CI 无需麦克风）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 代码规范
        run: ruff check .
      - name: 单元测试
        run: pytest -q
      - name: 架构约束（audio_core 不得依赖 Qt）
        run: python scripts/check_core_purity.py

  # 发布包只在打 tag 时才构建的话，「元数据写错 / 入口点丢了 / 少打子包」
  # 这类问题要等到发版那一刻才暴露。这里每次提交都构建并真装一遍。
  package-pypi:
    name: package (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 构建并检查元数据
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*
      - name: 装进干净环境跑一次
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/noisekit --version
          /tmp/verify/bin/noisekit --source synthetic --duration 1

  package:
    name: package (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,audio,gui]" pyinstaller
      - name: 打包
        run: python scripts/build.py
      - name: 冒烟测试打包产物（冻结依赖）
        shell: pwsh
        run: |
          # GUI 子系统的 exe 在 PowerShell 里不会等待，必须显式 WaitForExit。
          # 这里跑 --selftest-cli：不创建窗口，只验证冻结包里的
          # numpy / scipy / audio_core / PortAudio 都被正确打进去。
          # 界面链路由 tests/test_gui.py 在三平台上用源码覆盖。
          $log = Join-Path $env:RUNNER_TEMP 'selftest.log'
          $env:NOISEKIT_SELFTEST_LOG = $log
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path 'dist\NoiseKit\NoiseKit.exe').Path
          $psi.Arguments = '--selftest-cli'
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $proc = [System.Diagnostics.Process]::Start($psi)
          $finished = $proc.WaitForExit(180000)
          if (-not $finished) {
            $proc.Kill()
          }
          Write-Host $proc.StandardOutput.ReadToEnd()
          Write-Host $proc.StandardError.ReadToEnd()
          Write-Host '--- selftest 阶段日志 ---'
          if (Test-Path $log) { Get-Content $log } else { Write-Host '(没有日志，进程可能没跑起来)' }
          if (-not $finished) { throw 'selftest 超时未退出' }
          if ($proc.ExitCode -ne 0) {
            throw "selftest 失败，退出码 $($proc.ExitCode)"
          }
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: NoiseKit-windows
          path: dist/NoiseKit
