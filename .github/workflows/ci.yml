name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      # Windows 默认字符集装不下中文日志，统一成 UTF-8
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖（不含音频后端，CI 无需麦克风）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 代码规范
        run: ruff check .
      - name: 单元测试
        run: pytest -q
      - name: 架构约束（audio_core 不得依赖 Qt）
        run: python scripts/check_core_purity.py
