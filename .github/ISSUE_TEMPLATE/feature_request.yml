name: 功能建议
description: 新场景、新指标、新导出格式，或者用起来别扭的地方
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目对功能的态度是**先有真实场景，再加代码**。
        请在下面把「你遇到的具体麻烦」写清楚，比「希望支持 XX 功能」有用得多。
  - type: textarea
    id: scenario
    attributes:
      label: 你遇到的麻烦
      description: 具体到时间、地点、设备。描述现在你是怎么绕过它的。
      placeholder: |
        楼上凌晨一点装修，我要连续录两周。
        现在只能用界面一直开着，每天手动导出一次 HTML，
        想按天合并成一个报告做不到。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解决方式
      description: 界面放哪、命令行怎么调、输出长什么样。不用考虑实现难度。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 别的软件、脚本、手动流程都行。说清为什么不够用。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及的模块
      options:
        - 桌面界面
        - 命令行
        - 声学计算（计权/时间计权/Leq）
        - 告警与录音
        - 存储与导出（SQLite / CSV / HTML）
        - 打包与安装
        - 文档与示例
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我理解本项目不做计量认证，功能不面向法定检测
          required: true
        - label: 我搜索过现有 Issue，没有重复
          required: true
